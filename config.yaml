name: Home Panel
version: 0.1.1
slug: home_command_center
description: Information-rich Home Assistant dashboard with secure ingress and guarded home controls
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8000
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: Home Panel
panel_admin: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8000]/api/health
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Direct web access on your LAN at http://<home-assistant-ip>:8000 (in addition to authenticated ingress)
options: {}
schema: {}
